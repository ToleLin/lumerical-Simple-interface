# 推送版本標籤(例如 v0.1.0)時,在 GitHub 的 Windows 雲端機器上打包 LumEasy.exe,
# 跑單元測試與自我測試,再建立 Release 草稿並附上 EXE(到 Releases 頁按 Publish 才會公開)。
# 也可以在 Actions 頁手動執行(只打包,不建 Release,EXE 在 Artifacts 下載)。
name: Build and release EXE

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.22.3 pytest

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Build LumEasy.exe
        run: python -m PyInstaller LumEasy.spec --noconfirm --clean

      - name: Self-test the EXE (no Lumerical on the runner)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\LumEasy.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:TEMP\lumeasy_selftest.txt" -Encoding UTF8
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\LumEasy.exe -Algorithm SHA256).Hash.ToLower()
          "$h  LumEasy.exe" | Out-File dist\LumEasy.exe.sha256 -Encoding ascii
          Get-Content dist\LumEasy.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: LumEasy-exe
          path: |
            dist/LumEasy.exe
            dist/LumEasy.exe.sha256

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME dist/LumEasy.exe dist/LumEasy.exe.sha256 `
            --draft --title "LumEasy $env:GITHUB_REF_NAME" --notes-file docs/release_notes.md
